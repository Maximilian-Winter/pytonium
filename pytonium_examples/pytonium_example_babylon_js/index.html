<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Babylon.js 3D Scene</title>
    <script src="pytonium://babylon.js"></script>
    <script src="pytonium://babylonjs.loaders.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
    </style>
</head>
<body>
<div id="gameContainer" style="width: 100%; height: 100vh;"></div>
</body>
<script>
    function Init() {
        window.addEventListener('DOMContentLoaded', function () {
            var canvas = document.createElement("canvas");
            var container = document.getElementById("gameContainer");
            container.appendChild(canvas);
            canvas.width = container.offsetWidth;
            canvas.height = container.offsetHeight;

            var engine = new BABYLON.Engine(canvas, true);

            var createScene = function () {
                var scene = new BABYLON.Scene(engine);

                var camera = new BABYLON.ArcRotateCamera(
                    "Camera", Math.PI / 2, Math.PI / 4, 3,
                    new BABYLON.Vector3(0, 1, 0), scene
                );
                camera.attachControl(canvas, true);

                var light = new BABYLON.HemisphericLight(
                    "light1", new BABYLON.Vector3(0, 1, 0), scene
                );

                // Load animated character model from data/ directory
                // Place a .glb file (e.g. HipHopDancing.glb) in the data/ subdirectory
                BABYLON.SceneLoader.ImportMesh(
                    "", "pytonium-data://", "HipHopDancing.glb", scene,
                    function (meshes, particleSystems, skeletons) {
                        var character = meshes[0];
                        character.position = new BABYLON.Vector3(0, 0, 0);
                        if (skeletons.length > 0) {
                            scene.beginAnimation(skeletons[0], 0, 100, true, 0.8);
                        }
                    },
                    null,
                    function (scene, message, exception) {
                        console.error("Failed to load 3D model: " + message);
                        console.error("Place a .glb file in the data/ subdirectory.");
                    }
                );

                return scene;
            };

            var scene = createScene();

            engine.runRenderLoop(function () {
                scene.render();
            });

            window.addEventListener("resize", function () {
                engine.resize();
            });
        });
    }

    // Wait for Pytonium bindings to be ready before initializing
    if (window.PytoniumReady) {
        Init();
    } else {
        window.addEventListener('PytoniumReady', function () {
            Init();
        });
    }
</script>
</html>
