<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Babylon.js 3D Scene</title>
    <script src="pytonium://babylon.js"></script>
    <script src="pytonium://babylonjs.loaders.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            background: transparent;
        }
        #gameContainer {
            width: 100%;
            height: 100vh;
            background: transparent;
        }
        canvas {
            background: transparent !important;
        }

        /* Floating close button — top-right corner */
        .close-btn {
            position: fixed;
            top: 8px;
            right: 8px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: none;
            background: rgba(200, 50, 50, 0.7);
            color: white;
            font-size: 16px;
            line-height: 28px;
            text-align: center;
            cursor: pointer;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .close-btn:hover {
            background: rgba(220, 50, 50, 1);
        }
        body:hover .close-btn {
            opacity: 1;
        }

        /* Drag hint — fades in briefly on load */
        .drag-hint {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            color: #ccc;
            font-family: 'Segoe UI', sans-serif;
            font-size: 12px;
            padding: 6px 14px;
            border-radius: 12px;
            z-index: 1000;
            opacity: 0;
            animation: hintFade 4s ease-in-out;
            pointer-events: none;
        }
        @keyframes hintFade {
            0%   { opacity: 0; }
            15%  { opacity: 1; }
            75%  { opacity: 1; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>
<div id="gameContainer"></div>
<button class="close-btn" onclick="Pytonium.window.close()" title="Close">&#x2715;</button>
<div class="drag-hint">Drag to move &bull; Right-drag to orbit &bull; Esc to close</div>
</body>
<script>
    // ======================================================================
    // Window dragging: left-click initiates native OS drag (smooth, zero-latency)
    // Right-click drag orbits the Babylon.js camera
    // ======================================================================
    document.addEventListener('pointerdown', function (e) {
        // Don't start drag if clicking on interactive elements (close button, etc.)
        if (e.button === 0 && !e.target.closest('button, a, input, select')) {
            Pytonium.window.startDrag();
        }
    }, true);

    // Escape key to close
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
            Pytonium.window.close();
        }
    });

    // ======================================================================
    // Babylon.js 3D Scene
    // ======================================================================
    function Init() {
        window.addEventListener('DOMContentLoaded', function () {
            var canvas = document.createElement("canvas");
            var container = document.getElementById("gameContainer");
            container.appendChild(canvas);
            canvas.width = container.offsetWidth;
            canvas.height = container.offsetHeight;

            // Enable alpha (transparency) in the WebGL engine
            var engine = new BABYLON.Engine(canvas, true, {
                preserveDrawingBuffer: true,
                premultipliedAlpha: false,
                alpha: true
            });

            var createScene = function () {
                var scene = new BABYLON.Scene(engine);

                // Fully transparent background — the desktop shows through
                scene.clearColor = new BABYLON.Color4(0, 0, 0, 0);

                // Camera: positioned to frame a standing/dancing character
                var camera = new BABYLON.ArcRotateCamera(
                    "Camera",
                    Math.PI / 2,    // alpha: looking from the front
                    Math.PI / 2.5,  // beta: slightly above, looking down
                    3.5,            // radius: zoom distance
                    new BABYLON.Vector3(0, 0.8, 0),  // target: character mid-body
                    scene
                );
                // Right-click drag orbits the camera; left-click drag moves the window
                camera.attachControl(canvas, true);
                camera.inputs.attached.pointers.buttons = [1, 2]; // middle + right only
                camera.lowerRadiusLimit = 1.5;
                camera.upperRadiusLimit = 8;

                // Warm lighting for a character floating on desktop
                var mainLight = new BABYLON.HemisphericLight(
                    "mainLight",
                    new BABYLON.Vector3(0, 1, 0),
                    scene
                );
                mainLight.intensity = 0.9;
                mainLight.groundColor = new BABYLON.Color3(0.2, 0.2, 0.3);

                // Subtle rim light from behind for depth
                var rimLight = new BABYLON.DirectionalLight(
                    "rimLight",
                    new BABYLON.Vector3(-0.5, -0.3, -1),
                    scene
                );
                rimLight.intensity = 0.4;
                rimLight.diffuse = new BABYLON.Color3(0.6, 0.7, 1.0);

                // Load animated character model from data/ directory
                BABYLON.SceneLoader.ImportMesh(
                    "", "pytonium-data://", "HipHopDancing.glb", scene,
                    function (meshes, particleSystems, skeletons) {
                        var character = meshes[0];
                        character.position = new BABYLON.Vector3(0, 0, 0);

                        if (skeletons.length > 0) {
                            scene.beginAnimation(skeletons[0], 0, 100, true, 0.8);
                        }
                    },
                    null,
                    function (scene, message, exception) {
                        console.error("Failed to load 3D model: " + message);
                        console.error("Place a .glb file in the data/ subdirectory.");
                    }
                );

                return scene;
            };

            var scene = createScene();

            engine.runRenderLoop(function () {
                scene.render();
            });

            window.addEventListener("resize", function () {
                canvas.width = container.offsetWidth;
                canvas.height = container.offsetHeight;
                engine.resize();
            });
        });
    }

    // Wait for Pytonium bindings to be ready before initializing
    if (window.PytoniumReady) {
        Init();
    } else {
        window.addEventListener('PytoniumReady', function () {
            Init();
        });
    }
</script>
</html>
