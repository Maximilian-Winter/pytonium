name: Build Pytonium Wheels

on:
  push:
    branches:
      - master
    tags:
      - '*'
    paths:
      - 'CMakeLists.txt'
      - 'src/**'
      - 'cef-binaries-linux/**'
      - 'cef-binaries-windows/**'
      - 'building_pythonium_core/**'
      - '.github/workflows/build-wheels.yml'
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'src/**'
      - 'cef-binaries-linux/**'
      - 'cef-binaries-windows/**'
      - 'building_pythonium_core/**'
      - '.github/workflows/build-wheels.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: ${{ matrix.target.label }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.target.os }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        target:
          - label: Windows wheel
            os: windows-2022
            platform: windows
            cmake_build_dir: cmake-build-release
            cef_distribution: cef_binary_145.0.26+g6ed7554+chromium-145.0.7632.110_windows64_minimal
            cef_dir: cef-binaries-windows
            artifact_name: pytonium-windows-wheel
          - label: Linux wheel
            os: ubuntu-24.04
            platform: linux
            cmake_build_dir: build_linux
            cef_distribution: cef_binary_145.0.26+g6ed7554+chromium-145.0.7632.110_linux64_minimal
            cef_dir: cef-binaries-linux
            artifact_name: pytonium-linux-wheel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            binutils \
            cmake \
            ninja-build \
            libx11-dev \
            libxext-dev \
            libatk-bridge2.0-0 \
            libasound2t64 \
            patchelf \
            libgbm1 \
            libgtk-3-0 \
            libnss3 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build scikit-build cmake ninja Cython pytest auditwheel

      - name: Cache CEF binary distribution
        id: cache-cef
        uses: actions/cache@v4
        with:
          path: ${{ matrix.target.cef_dir }}
          key: cef-${{ matrix.target.cef_distribution }}

      - name: Download CEF binary distribution
        if: steps.cache-cef.outputs.cache-hit != 'true'
        run: >
          python -c "from pathlib import Path; import hashlib; import shutil; import tarfile; import urllib.parse; import urllib.request;
          distribution = '${{ matrix.target.cef_distribution }}';
          target = Path('${{ matrix.target.cef_dir }}');
          filename = distribution + '.tar.bz2';
          url = 'https://cef-builds.spotifycdn.com/' + urllib.parse.quote(filename, safe='/:');
          print(f'Downloading {url}');
          archive = Path(filename);
          expected_sha1 = urllib.request.urlopen(url + '.sha1').read().decode().strip();
          urllib.request.urlretrieve(url, archive);
          actual_sha1 = hashlib.sha1(archive.read_bytes()).hexdigest();
          assert actual_sha1 == expected_sha1, f'SHA1 mismatch: {actual_sha1} != {expected_sha1}';
          archive_tar = tarfile.open(archive, 'r:bz2');
          archive_tar.extractall('.');
          archive_tar.close();
          extracted = Path(distribution);
          assert extracted.exists(), f'Extracted CEF directory not found: {extracted}';
          shutil.rmtree(target, ignore_errors=True);
          extracted.rename(target)"

      - name: Verify CEF inputs
        run: >
          python -c "from pathlib import Path;
          root = Path('${{ matrix.target.cef_dir }}');
          required = ['cmake/FindCEF.cmake', 'include/cef_app.h', 'libcef_dll/CMakeLists.txt', 'Release/libcef.so' if '${{ matrix.target.platform }}' == 'linux' else 'Release/libcef.lib'];
          missing = [item for item in required if not (root / item).exists()];
          assert not missing, f'Missing CEF inputs in {root}: {missing}'"

      - name: Cache native build directory
        uses: actions/cache@v4
        with:
          path: ${{ matrix.target.cmake_build_dir }}
          key: ${{ runner.os }}-cmake-${{ matrix.python-version }}-${{ hashFiles('CMakeLists.txt', 'src/pytonium_library/**', 'src/pytonium_subprocess/**', '.github/workflows/build-wheels.yml') }}
          restore-keys: |
            ${{ runner.os }}-cmake-${{ matrix.python-version }}-
            ${{ runner.os }}-cmake-

      - name: Configure native build
        run: >
          cmake -S . -B ${{ matrix.target.cmake_build_dir }}
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DUSE_SANDBOX=OFF

      - name: Build pytonium_subprocess
        run: >
          cmake --build ${{ matrix.target.cmake_build_dir }}
          --target pytonium_subprocess
          --config ${{ env.BUILD_TYPE }}
          --parallel

      - name: Prepare Python wheel inputs
        run: >
          python building_pythonium_core/prepare_build.py
          --platform ${{ matrix.target.platform }}
          --build-dir ${{ matrix.target.cmake_build_dir }}
          --verbose

      - name: Build wheel
        working-directory: src/pytonium_python_framework
        run: python -m build --wheel

      - name: Repair Linux wheel for PyPI
        if: runner.os == 'Linux'
        working-directory: src/pytonium_python_framework
        run: |
          LD_LIBRARY_PATH="$PWD/Pytonium/bin_linux:${LD_LIBRARY_PATH:-}" python -m auditwheel repair --exclude libcef.so dist/*.whl -w wheelhouse
          rm dist/*.whl
          mv wheelhouse/*.whl dist/

      - name: Install built wheel
        run: >
          python -c "from pathlib import Path; import subprocess; import sys;
          wheels = sorted(Path('src/pytonium_python_framework/dist').glob('*.whl'));
          assert len(wheels) == 1, wheels;
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', str(wheels[0])])"

      - name: Configure Linux CEF runtime path
        if: runner.os == 'Linux'
        run: >
          python -c "from pathlib import Path; import os; import site;
          site_paths = site.getsitepackages() + [site.getusersitepackages()];
          candidates = [Path(path) / 'Pytonium' / 'bin_linux' for path in site_paths];
          bin_dir = next((path for path in candidates if path.exists()), None);
          assert bin_dir is not None, f'Could not find installed Pytonium/bin_linux in {site_paths}';
          existing = os.environ.get('LD_LIBRARY_PATH', '');
          Path(os.environ['GITHUB_ENV']).open('a').write(f'LD_LIBRARY_PATH={bin_dir}:{existing}\n')"

      - name: Verify installed runtime files
        run: >
          python -c "from pathlib import Path; import site;
          package_roots = [Path(path) / 'Pytonium' for path in site.getsitepackages() + [site.getusersitepackages()]];
          package_root = next((path for path in package_roots if path.exists()), None);
          assert package_root is not None, f'Could not find installed Pytonium package in {package_roots}';
          bin_dir = package_root / ('bin_linux' if '${{ matrix.target.platform }}' == 'linux' else 'bin_win');
          subprocess_name = 'pytonium_subprocess' if '${{ matrix.target.platform }}' == 'linux' else 'pytonium_subprocess.exe';
          required = [subprocess_name, 'v8_context_snapshot.bin'];
          missing = [name for name in required if not (bin_dir / name).exists()];
          assert not missing, f'Missing CEF runtime files in {bin_dir}: {missing}'"

      - name: Run API smoke tests
        run: python -m pytest tests/test_pytonium_api.py

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.artifact_name }}-py${{ matrix.python-version }}
          path: src/pytonium_python_framework/dist/*.whl
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pytonium-*-wheel-py*
          path: release-artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*.whl
          generate_release_notes: true

  pypi:
    name: Publish PyPI release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04

    environment:
      name: pypi
      url: https://pypi.org/p/Pytonium

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pytonium-*-wheel-py*
          path: dist
          merge-multiple: true

      - name: Publish wheels to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          print-hash: true
