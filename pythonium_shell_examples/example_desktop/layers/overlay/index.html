<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --bg: rgba(15, 15, 30, 0.92);
    --fg: #c0caf5;
    --muted: #565f89;
    --accent: #7aa2f7;
    --accent2: #bb9af7;
    --hover: rgba(255, 255, 255, 0.06);
    --border: rgba(255, 255, 255, 0.08);
    --search-bg: rgba(36, 40, 59, 0.9);
}

html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
    color: var(--fg);
    user-select: none;
    -webkit-user-select: none;
}

body {
    background: var(--bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 15vh;
    opacity: 0;
    transition: opacity 250ms ease;
}

body.fade-in { opacity: 1; }
body.fade-out { opacity: 0; }

/* ── Search box ── */
.search-container {
    width: 500px;
    max-width: 90vw;
    margin-bottom: 30px;
}

.search-input {
    width: 100%;
    padding: 14px 20px;
    background: var(--search-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--fg);
    font-size: 16px;
    font-family: inherit;
    outline: none;
    transition: border-color 200ms;
}
.search-input::placeholder { color: var(--muted); }
.search-input:focus { border-color: var(--accent); }

/* ── App grid ── */
.app-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 8px;
    width: 700px;
    max-width: 90vw;
    max-height: 60vh;
    overflow-y: auto;
    padding: 4px;
    scrollbar-width: thin;
    scrollbar-color: var(--muted) transparent;
}

.app-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px 8px;
    border-radius: 10px;
    cursor: pointer;
    transition: background 150ms;
    gap: 6px;
}
.app-item:hover { background: var(--hover); }
.app-item:active { background: rgba(122, 162, 247, 0.15); }

.app-icon {
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 8px;
    font-size: 16px;
    font-weight: 700;
    color: white;
    text-transform: uppercase;
}

.app-name {
    font-size: 11px;
    text-align: center;
    color: var(--fg);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 100%;
    line-height: 1.3;
}

/* ── Status ── */
.status {
    position: fixed;
    bottom: 20px;
    color: var(--muted);
    font-size: 11px;
}
</style>
</head>
<body>

<div class="search-container">
    <input type="text" class="search-input" id="searchInput"
           placeholder="Search applications..." autofocus>
</div>

<div class="app-grid" id="appGrid"></div>

<div class="status" id="status">Loading apps...</div>

<script>
let allApps = [];
let filteredApps = [];

// Get initial letter for icon
function getInitial(name) {
    return name.charAt(0).toUpperCase();
}

// Generate a color from app name (deterministic)
function nameToHue(name) {
    let hash = 0;
    for (let i = 0; i < name.length; i++) {
        hash = name.charCodeAt(i) + ((hash << 5) - hash);
    }
    return Math.abs(hash) % 360;
}

function renderApps(apps) {
    const grid = document.getElementById('appGrid');
    grid.innerHTML = '';

    const show = apps.slice(0, 100); // Limit for performance

    for (const app of show) {
        const item = document.createElement('div');
        item.className = 'app-item';
        item.title = app.name;

        const hue = nameToHue(app.name);
        item.innerHTML = `
            <div class="app-icon" style="background: linear-gradient(135deg, hsl(${hue}, 60%, 45%), hsl(${(hue + 40) % 360}, 60%, 45%))">
                ${getInitial(app.name)}
            </div>
            <div class="app-name">${escapeHtml(app.name)}</div>
        `;

        item.addEventListener('click', () => {
            if (typeof Pytonium !== 'undefined' && Pytonium.layer) {
                Pytonium.layer.launch_app(app.path);
            }
        });

        grid.appendChild(item);
    }

    document.getElementById('status').textContent =
        `${apps.length} application${apps.length !== 1 ? 's' : ''} found`;
}

function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

// Search filtering
document.getElementById('searchInput').addEventListener('input', (e) => {
    const query = e.target.value.toLowerCase().trim();
    if (!query) {
        filteredApps = allApps;
    } else {
        filteredApps = allApps.filter(a =>
            a.name.toLowerCase().includes(query)
        );
    }
    renderApps(filteredApps);
});

// Escape key hides overlay
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
        document.body.classList.remove('fade-in');
        document.body.classList.add('fade-out');
    }
});

// Load apps from backend
function initPytonium() {
    if (typeof Pytonium === 'undefined') {
        setTimeout(initPytonium, 100);
        return;
    }

    // Fetch installed apps
    if (Pytonium.layer && Pytonium.layer.get_installed_apps) {
        Pytonium.layer.get_installed_apps().then(apps => {
            allApps = apps || [];
            filteredApps = allApps;
            renderApps(filteredApps);
        }).catch(err => {
            document.getElementById('status').textContent = 'Failed to load apps';
            console.error('Failed to load apps:', err);
        });
    }

    // Focus search input when overlay becomes visible
    const observer = new MutationObserver(() => {
        if (document.body.classList.contains('fade-in')) {
            setTimeout(() => {
                const input = document.getElementById('searchInput');
                input.focus();
                input.select();
            }, 50);
        }
    });
    observer.observe(document.body, { attributes: true, attributeFilter: ['class'] });
}

// Boot
if (window.PytoniumReady) {
    initPytonium();
} else {
    window.addEventListener('PytoniumReady', initPytonium);
}
</script>
</body>
</html>
